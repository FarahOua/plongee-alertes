<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;font-family:system-ui,sans-serif;font-size:14px">
<div id="msg"></div>
<script>
// Composant Streamlit invisible : fait les appels Open-Meteo DEPUIS LE NAVIGATEUR du visiteur
// (sa propre adresse IP, donc pas le quota partagé du serveur) et renvoie les réponses brutes à Python.
let lastRun = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function get(req) {
  const url = req.url + "?" + new URLSearchParams(req.params).toString();
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 25000);
      const resp = await fetch(url, { signal: ctl.signal }); clearTimeout(timer);
      if (resp.ok) return await resp.json();
      if (resp.status === 400) return null;          // requête refusée : inutile de réessayer
    } catch (e) { /* réseau : on réessaie une fois */ }
    await sleep(2000);
  }
  return null;
}

async function run(args) {
  const requests = args.requests || [];
  const out = {};
  const results = await Promise.all(requests.map(get));
  requests.forEach((r, i) => { out[r.id] = results[i]; });
  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue",
                              value: { responses: out }, dataType: "json" }, "*");
}

window.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  const args = ev.data.args || {};
  window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: 0 }, "*");
  const id = JSON.stringify((args.requests || []).map(r => r.id));
  if (id === lastRun) return;                          // déjà fait : on ne refait pas les appels
  lastRun = id;
  run(args);
});
window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
</script></body></html>
